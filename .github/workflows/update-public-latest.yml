name: Mise à jour publique temporaire

on:
  push:
    paths:
      - '.github/workflows/update-public-latest.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la dernière version publique
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY.split('/').pop();
          let s = fs.readFileSync('index.html','utf8');
          const css = `\n<style>\n.license-notice{\n  max-width:1100px;\n  margin:18px auto 8px;\n  padding:10px 16px;\n  text-align:center;\n  font-size:11px;\n  line-height:1.45;\n  color:#6b6870;\n}\n.license-notice a{color:inherit;text-decoration:underline}\n@media print{.license-notice{display:none!important}}\n</style>\n`;
          if(!s.includes('.license-notice{')) s=s.replace('</head>', css+'\n</head>');
          const cfg = {
            'analyse-fonctionnelle-abc': {
              anchor:`    <button class="btn green" onclick="exportCSV()">⬇ Export CSV</button>`,
              button:`    <button class="btn red" onclick="effacerToutesLesDonneesOutil()">Effacer toutes les données</button>`,
              fn:`function effacerToutesLesDonneesOutil(){\n  if(!confirm("Effacer définitivement tous les dossiers, observations et brouillons enregistrés par cet outil dans ce navigateur ?")) return;\n  localStorage.removeItem(STORAGE_KEY);\n  alert("Toutes les données enregistrées par cet outil ont été supprimées.");\n  location.reload();\n}`
            },
            'passeport-accompagnement': {
              anchor:`    <button class="btn danger" onclick="supprimerDossier()">Supprimer le dossier</button>`,
              button:`    <button class="btn danger" onclick="effacerToutesLesDonneesOutil()">Effacer toutes les données</button>`,
              fn:`function effacerToutesLesDonneesOutil(){\n  if(!confirm("Effacer définitivement tous les passeports, historiques et données enregistrés par cet outil dans ce navigateur ?")) return;\n  localStorage.removeItem(KEY);\n  localStorage.removeItem(OLD_KEY);\n  alert("Toutes les données enregistrées par cet outil ont été supprimées.");\n  location.reload();\n}`
            },
            'generateur-planning-visuel': {
              anchor:`    <button class="btn blue" onclick="window.print()">Imprimer / PDF</button>`,
              button:`    <button class="btn danger" onclick="effacerToutesLesDonneesOutil()">Effacer toutes les données</button>`,
              fn:`function effacerToutesLesDonneesOutil(){\n  if(!confirm("Effacer définitivement tous les plannings et brouillons enregistrés par cet outil dans ce navigateur ?")) return;\n  localStorage.removeItem(STORE);\n  localStorage.removeItem(DRAFT);\n  alert("Toutes les données enregistrées par cet outil ont été supprimées.");\n  location.reload();\n}`
            },
            'generateur-sequences-visuelles': {
              anchor:`    <button class="btn blue" onclick="printSequence()">Imprimer / PDF</button>`,
              button:`    <button class="btn danger" onclick="effacerToutesLesDonneesOutil()">Effacer toutes les données</button>`,
              fn:`function effacerToutesLesDonneesOutil(){\n  if(!confirm("Effacer définitivement toutes les séquences et tous les brouillons enregistrés par cet outil dans ce navigateur ?")) return;\n  localStorage.removeItem(STORE);\n  localStorage.removeItem(DRAFT);\n  alert("Toutes les données enregistrées par cet outil ont été supprimées.");\n  location.reload();\n}`
            },
            'qui-est-la-aujourdhui': {
              anchor:`    <button class="ghost" onclick="newBoard()">Nouveau tableau</button>`,
              button:`    <button class="danger" onclick="effacerToutesLesDonneesOutil()">Effacer toutes les données</button>`,
              fn:`function effacerToutesLesDonneesOutil(){\n  if(!confirm("Effacer définitivement le tableau, les prénoms et les photos enregistrés par cet outil dans ce navigateur ?")) return;\n  localStorage.removeItem(KEY);\n  alert("Toutes les données enregistrées par cet outil ont été supprimées.");\n  location.reload();\n}`
            }
          }[repo];
          if(!cfg) throw new Error('Dépôt non prévu: '+repo);
          if(!s.includes('Effacer toutes les données')) {
            if(!s.includes(cfg.anchor)) throw new Error('Ancre du bouton introuvable');
            s=s.replace(cfg.anchor, cfg.anchor+'\n'+cfg.button);
          }
          if(!s.includes('data-goatcounter=')) {
            const tail=`\n  \n<script>\n${cfg.fn}\n<\/script>\n\n<script data-goatcounter="https://menadmalek.goatcounter.com/count"\n          async src="//gc.zgo.at/count.js"><\/script>\n\n<div class="license-notice no-print">\n  © 2026 Malek MENAD — Usage personnel gratuit.\n  Usage professionnel ou institutionnel soumis à autorisation préalable.\n  Revente interdite. <a href="LICENSE.txt" target="_blank" rel="noopener">Voir la licence</a>.\n</div>\n`;
            s=s.replace('</body>',tail+'</body>');
          }
          fs.writeFileSync('index.html',s,'utf8');
          const licenseB64='';
          fs.writeFileSync('LICENSE.txt',Buffer.from(licenseB64,'base64').toString('utf8'),'utf8');
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name "MenadMalek"
          git config user.email "malekounou@gmail.com"
          git add index.html LICENSE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Mettre à jour l'outil public vers la dernière version"
          git push
